name: CI

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
    branches: [main]

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit || true
      - run: npx vite build
      - run: npx vitest run

  build-api:
    name: Build API Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t frio-api ./nodered/weg-api

  build-poller:
    name: Build Poller Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t frio-poller ./nodered/weg-modbus-poller

  packaging:
    name: Paquete de instalación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n packaging/install.sh && bash -n packaging/frio-scada
      - run: bash packaging/make-release.sh ci out
      - name: El compose del paquete es válido
        run: |
          mkdir -p t && tar xzf out/frio-scada-ci.tar.gz -C t && cd t/frio-scada
          FRIO_VERSION=ci docker compose config -q
          FRIO_VERSION=ci docker compose -f docker-compose.yml -f docker-compose.replica.yml config -q

  tests:
    name: Tests (frio-api y poller)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd nodered/weg-api && npm install --no-audit --no-fund && npm test
      - run: cd nodered/weg-modbus-poller && npm install --no-audit --no-fund && npm test
