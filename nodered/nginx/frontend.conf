# Websocket solo si el cliente lo pide (Grafana Live)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# La cookie frio_token (sesion del portal) no se reenvia a Grafana; el resto
# (grafana_session) si. Con solo frio_token queda ";" (inofensivo).
map $http_cookie $grafana_cookie {
    default $http_cookie;
    "~^(?<ck_a>.*?)(?:^|;\s*)frio_token=[^;]*(?:;\s*(?<ck_b>.*))?$" "$ck_a;$ck_b";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver Docker DNS + variable para que nginx re-resuelva en cada request
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://frio-api:3200;

    # Proxy /api/* to frio-api (no trailing slash = path preserved as-is)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subrequest interno de auth_request: frio-api valida el token (cookie
    # frio_token o Authorization) y devuelve 204 + X-Auth-User. Sin body.
    # internal: no se puede pedir desde afuera.
    location = /api/auth/grafana {
        internal;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    # Grafana embebido: nunca se expone directo. auth_request → X-WEBAUTH-USER
    # se pisa SIEMPRE con el usuario validado (un X-WEBAUTH-USER del cliente
    # no llega a Grafana).
    # ^~: sin esto la regex de assets (js/css) le gana y Grafana sirve en blanco.
    location ^~ /grafana/ {
        auth_request /api/auth/grafana;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        set $grafana_upstream http://frio-grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header Authorization "";
        proxy_set_header Cookie $grafana_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # MQTT sobre WebSocket: pasa por frio-api, que exige token (sesión o réplica)
    # y corta la conexión al revocar/cerrar sesión. Sin access log: la URL del
    # navegador lleva ?token=. error_log solo crit por la misma razón.
    # Regex sin distinguir mayúsculas: /MQTT o /mqtt/ también llegan a frio-api.
    location ~* ^/mqtt/?$ {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — all unmatched routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets forever, never cache index.html
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
