##############################################################################
# Grafana Auto-Provisioning: InfluxDB Data Source
# This file auto-configures the InfluxDB connection on first start
##############################################################################

apiVersion: 1

datasources:
  - name: InfluxDB-Frio
    type: influxdb
    uid: influxdb-frio
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: tecnoelectric
      defaultBucket: camaras
    secureJsonData:
      # Interpolado desde la variable de entorno del contenedor (ver docker-compose.yml)
      token: $INFLUXDB_GRAFANA_TOKEN
    editable: true
